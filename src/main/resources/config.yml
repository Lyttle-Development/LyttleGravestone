##################################################
#         Lyttle Gravestone - config.yml         #
##################################################
# This file contains all configuration settings for the plugin.
# You are free to customize these settings to your server's needs.
#
# ⚠️ WARNING: Do NOT remove any keys from this file.
# Doing so may cause the plugin to break or behave unexpectedly.
# If you're unsure, refer to #defaults/config.yml for original values.
##################################################

##############################
# Retrieve Command Settings #
##############################

# Enables or disables the /retrievegravestone (/rg) command.
# If set to false, the command will be unavailable to players.
# [Default]: true
retrieve_command_active: true

# Distance block chunk size used in delivery cost calculation.
# Formula: (distance / retrieve_command_blocks) * retrieve_command_price
# [Default]: 100
retrieve_command_blocks: 100

# Cost per block chunk (as defined above).
# This value is only applied if "use_vault" is set to true.
# [Default]: 3
retrieve_command_price: 3

# Additional cost added when retrieving a gravestone from a different world.
# This is added *once* on top of the normal distance-based cost.
# Only applied if "use_vault" is enabled.
# [Default]: 100
retrieve_command_price__other_world: 100

##########################
# Economy Integration    #
##########################

# Enables integration with Vault-based economy plugins.
# If false, retrieval will cost 0 tokens regardless of other settings.
# [Default]: true
use_vault: true

##########################
# Configuration Version  #
##########################

# DO NOT EDIT THIS VALUE.
# This is used internally to manage config migrations on plugin updates.
config_version: 2
